<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1020" width="1080" height="1020" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="titulo">
  <title id="titulo">Diagrama de casos de uso - Sistema Control de Emergencias</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
  </defs>
  <style>
    .fondo { fill: #ffffff; }
    .sistema { fill: #fafbfc; stroke: #333; stroke-width: 1.5; }
    .titulo { font-size: 17px; font-weight: 600; fill: #1b1b1b; }
    .cu ellipse { fill: #eef4fb; stroke: #2f5d8a; stroke-width: 1.4; }
    .cu.aux ellipse { fill: #fff7e8; stroke: #a8741a; }
    .cu text { font-size: 13.5px; fill: #1b1b1b; text-anchor: middle; dominant-baseline: middle; }
    .actor circle, .actor line { fill: #ffffff; stroke: #222; stroke-width: 1.8; }
    .actor text { font-size: 14px; font-weight: 600; fill: #1b1b1b; text-anchor: middle; }
    .asoc { stroke: #555; stroke-width: 1.2; }
    .gen { stroke: #222; stroke-width: 1.5; }
    .gen-punta { fill: #ffffff; stroke: #222; stroke-width: 1.5; }
    .dep { stroke: #333; stroke-width: 1.3; stroke-dasharray: 6 4; fill: none; }
    .estereo { font-size: 12px; fill: #333; text-anchor: middle; font-style: italic; }
    .grupo { font-size: 11.5px; fill: #6a6a6a; letter-spacing: 0.04em; }
  </style>

  <rect class="fondo" x="0" y="0" width="1080" height="1020"/>

  <!-- Límite del sistema -->
  <rect class="sistema" x="230" y="30" width="830" height="975" rx="6"/>
  <text class="titulo" x="645" y="58" text-anchor="middle">Sistema Control de Emergencias</text>

  <!-- Etiquetas de grupo -->
  <text class="grupo" x="244" y="82">CIUDADANO</text>
  <text class="grupo" x="244" y="272">TODO USUARIO AUTENTICADO</text>
  <text class="grupo" x="244" y="700">PERSONAL OPERATIVO</text>
  <text class="grupo" x="244" y="900">ADMINISTRADOR</text>

  <!-- Actores -->
  <g class="actor" transform="translate(95,95)">
    <circle cx="0" cy="12" r="12"/><line x1="0" y1="24" x2="0" y2="60"/>
    <line x1="-20" y1="36" x2="20" y2="36"/><line x1="0" y1="60" x2="-16" y2="90"/><line x1="0" y1="60" x2="16" y2="90"/>
    <text x="0" y="110">Ciudadano</text>
  </g>
  <g class="actor" transform="translate(95,410)">
    <circle cx="0" cy="12" r="12"/><line x1="0" y1="24" x2="0" y2="60"/>
    <line x1="-20" y1="36" x2="20" y2="36"/><line x1="0" y1="60" x2="-16" y2="90"/><line x1="0" y1="60" x2="16" y2="90"/>
    <text x="0" y="110">Usuario</text><text x="0" y="127">autenticado</text>
  </g>
  <g class="actor" transform="translate(95,700)">
    <circle cx="0" cy="12" r="12"/><line x1="0" y1="24" x2="0" y2="60"/>
    <line x1="-20" y1="36" x2="20" y2="36"/><line x1="0" y1="60" x2="-16" y2="90"/><line x1="0" y1="60" x2="16" y2="90"/>
    <text x="0" y="110">Operador</text>
  </g>
  <g class="actor" transform="translate(95,880)">
    <circle cx="0" cy="12" r="12"/><line x1="0" y1="24" x2="0" y2="60"/>
    <line x1="-20" y1="36" x2="20" y2="36"/><line x1="0" y1="60" x2="-16" y2="90"/><line x1="0" y1="60" x2="16" y2="90"/>
    <text x="0" y="110">Administrador</text>
  </g>

  <!-- Generalizaciones (el hijo apunta al padre) -->
  <line class="gen" x1="95" y1="212" x2="95" y2="392"/>
  <polygon class="gen-punta" points="95,406 86,392 104,392"/>
  <line class="gen" x1="95" y1="694" x2="95" y2="562"/>
  <polygon class="gen-punta" points="95,548 86,562 104,562"/>
  <line class="gen" x1="95" y1="874" x2="95" y2="830"/>
  <polygon class="gen-punta" points="95,816 86,830 104,830"/>

  <!-- Asociaciones actor - caso de uso -->
  <line class="asoc" x1="120" y1="140" x2="290" y2="100"/>
  <line class="asoc" x1="120" y1="140" x2="290" y2="160"/>
  <line class="asoc" x1="120" y1="140" x2="290" y2="220"/>

  <line class="asoc" x1="120" y1="455" x2="290" y2="300"/>
  <line class="asoc" x1="120" y1="455" x2="290" y2="355"/>
  <line class="asoc" x1="120" y1="455" x2="290" y2="410"/>
  <line class="asoc" x1="120" y1="455" x2="290" y2="465"/>
  <line class="asoc" x1="120" y1="455" x2="290" y2="520"/>
  <line class="asoc" x1="120" y1="455" x2="290" y2="575"/>
  <line class="asoc" x1="120" y1="455" x2="290" y2="630"/>

  <line class="asoc" x1="120" y1="745" x2="290" y2="730"/>
  <line class="asoc" x1="120" y1="745" x2="290" y2="790"/>
  <line class="asoc" x1="120" y1="745" x2="290" y2="850"/>

  <line class="asoc" x1="120" y1="925" x2="290" y2="935"/>

  <!-- Casos de uso principales -->
  <g class="cu"><ellipse cx="420" cy="100" rx="130" ry="24"/><text x="420" y="100">Registrarse</text></g>
  <g class="cu"><ellipse cx="420" cy="160" rx="130" ry="24"/><text x="420" y="160">Editar mi reporte nuevo</text></g>
  <g class="cu"><ellipse cx="420" cy="220" rx="130" ry="24"/><text x="420" y="220">Cancelar mi reporte</text></g>

  <g class="cu"><ellipse cx="420" cy="300" rx="130" ry="24"/><text x="420" y="300">Iniciar sesión</text></g>
  <g class="cu"><ellipse cx="420" cy="355" rx="130" ry="24"/><text x="420" y="355">Cerrar sesión</text></g>
  <g class="cu"><ellipse cx="420" cy="410" rx="130" ry="24"/><text x="420" y="410">Ver mi perfil</text></g>
  <g class="cu"><ellipse cx="420" cy="465" rx="130" ry="24"/><text x="420" y="465">Consultar reportes</text></g>
  <g class="cu"><ellipse cx="420" cy="520" rx="130" ry="24"/><text x="420" y="520">Ver detalle e historial</text></g>
  <g class="cu"><ellipse cx="420" cy="575" rx="130" ry="24"/><text x="420" y="575">Comentar reporte</text></g>
  <g class="cu"><ellipse cx="420" cy="630" rx="130" ry="24"/><text x="420" y="630">Crear reporte</text></g>

  <g class="cu"><ellipse cx="420" cy="730" rx="130" ry="24"/><text x="420" y="730">Gestionar reporte</text></g>
  <g class="cu"><ellipse cx="420" cy="790" rx="130" ry="24"/><text x="420" y="790">Ver resumen (dashboard)</text></g>
  <g class="cu"><ellipse cx="420" cy="850" rx="130" ry="24"/><text x="420" y="850">Consultar personal y carga</text></g>

  <g class="cu"><ellipse cx="420" cy="935" rx="130" ry="24"/><text x="420" y="935">Crear cuenta de operador</text></g>

  <!-- Casos incluidos y extensiones -->
  <g class="cu aux"><ellipse cx="870" cy="300" rx="145" ry="24"/><text x="870" y="300">Bloquear tras 10 intentos fallidos</text></g>
  <g class="cu aux"><ellipse cx="870" cy="465" rx="145" ry="24"/><text x="870" y="465">Filtrar y buscar por cercanía</text></g>
  <g class="cu aux"><ellipse cx="870" cy="680" rx="145" ry="24"/><text x="870" y="680">Registrar en historial</text></g>
  <g class="cu aux"><ellipse cx="870" cy="770" rx="145" ry="24"/><text x="870" y="770">Asignar responsable</text></g>
  <g class="cu aux"><ellipse cx="870" cy="840" rx="145" ry="24"/><text x="870" y="840">Cambiar estado y prioridad</text></g>

  <!-- «extend»: de la extensión al caso base -->
  <line class="dep" x1="725" y1="300" x2="552" y2="300" marker-end="url(#flecha)"/>
  <text class="estereo" x="638" y="290">«extend»</text>
  <line class="dep" x1="725" y1="465" x2="552" y2="465" marker-end="url(#flecha)"/>
  <text class="estereo" x="638" y="455">«extend»</text>
  <line class="dep" x1="728" y1="766" x2="548" y2="736" marker-end="url(#flecha)"/>
  <text class="estereo" x="660" y="770">«extend»</text>
  <line class="dep" x1="735" y1="830" x2="540" y2="744" marker-end="url(#flecha)"/>
  <text class="estereo" x="694" y="832">«extend»</text>

  <!-- «include»: del caso base al incluido -->
  <line class="dep" x1="545" y1="637" x2="728" y2="672" marker-end="url(#flecha)"/>
  <text class="estereo" x="636" y="640">«include»</text>
  <line class="dep" x1="545" y1="723" x2="728" y2="688" marker-end="url(#flecha)"/>
  <text class="estereo" x="636" y="725">«include»</text>
</svg>
