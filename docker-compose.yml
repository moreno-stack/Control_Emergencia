services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: control_emergencias_db
      POSTGRES_USER: emergencias_user
      POSTGRES_PASSWORD: emergencias_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

  # Opcional: pgAdmin para administrar la base de datos (http://localhost:5050)
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@emergencias.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data:
